# Encodes the thresholds from ~/.config/ai-agent-guidelines/code-structure.md.
#
# Those are stated as ERROR severities, so they are configured to fail rather
# than warn. `parameters` is the one standard WARN in that document — it is the
# migration lane for existing violations — but this repo has drained its only
# violation, so it is raised to ERROR here per the same document's instruction.
#
# NOT ENFORCED HERE, because SwiftLint has no equivalent rule:
#   - executable control-flow nesting depth (limit 4). SwiftLint's `nesting`
#     rule measures TYPE and FUNCTION nesting, not if/for/switch depth.
#   - cognitive complexity (limit 15).
#   - nested callback depth (limit 4); `closure_body_length` is a rough proxy
#     and is enabled below, but it measures size, not depth.
# Those three are unmeasured. Do not report them as passing.

only_rules:
  # --- code-structure.md thresholds ---
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - closure_body_length
  - nesting

  # --- languages/swift.md strictness ---
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - empty_count
  - implicit_optional_initialization
  - unused_optional_binding
  - toggle_bool

  # --- correctness ---
  - unused_closure_parameter
  - unused_enumerated
  - duplicate_imports
  - redundant_nil_coalescing
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - sorted_first_last

analyzer_rules: []

function_body_length:
  warning: 60
  error: 60

cyclomatic_complexity:
  warning: 20
  error: 20
  ignores_case_statements: false

function_parameter_count:
  warning: 6
  error: 6

closure_body_length:
  warning: 60
  error: 60

nesting:
  type_level: 3
  function_level: 3

force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: error

included:
  - Sources
  - Tests

excluded:
  - .build
